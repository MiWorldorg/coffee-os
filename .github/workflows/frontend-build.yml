name: Frontend build

on:
  push:
    branches:
      - master
      - chore/coffeeos-revival-phase-1
      - feat/phase-2-svelte-foundation
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and synchronize lockfile
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/phase-2-svelte-foundation'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi
