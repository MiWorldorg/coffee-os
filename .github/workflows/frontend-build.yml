name: Frontend build

on:
  push:
    branches:
      - master
      - chore/coffeeos-revival-phase-1
      - feat/phase-2-svelte-foundation
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and synchronize lockfile
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build
